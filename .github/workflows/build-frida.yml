name: Build Frida Server

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida Version/Tag (例如: 16.1.4 或 main)'
        required: true
        default: 'main'
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm
          - x86
          - x86_64

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.frida_version }}
          fetch-depth: 0

      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force || echo "Submodule update warning ignored"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git flex bison libglib2.0-dev ninja-build

      # 修正點：使用 Frida 官方 Makefile 正確的 target 語法
      - name: Build Frida
        run: |
          make android-${{ github.event.inputs.target_arch }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-${{ github.event.inputs.frida_version }}-android-${{ github.event.inputs.target_arch }}
          path: |
            build/frida-android-*/bin/frida-server*
            build/submodules/frida-core/server/frida-server*
            build/tmp-android-*/frida-core/server/frida-server*
