name: Build Frida Server

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida Version/Tag (例如: 16.1.4 或 main)'
        required: true
        default: '16.1.4'
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm
          - x86
          - x86_64

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.frida_version }}
          fetch-depth: 0

      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force || echo "Submodule update warning ignored"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git flex bison libglib2.0-dev ninja-build

      - name: Build Frida Server
        run: |
          # 定義目標平台名稱
          HOST_PLATFORM="android-${{ github.event.inputs.target_arch }}"
          
          # 如果有 setup-env.sh，先載入環境變數與工具鏈
          if [ -f "releng/setup-env.sh" ]; then
            source releng/setup-env.sh
          fi

          # 情況 1：Frida 16.2+ / 17+ 版本的 Python 構建入口
          if [ -f "releng/build.py" ]; then
            python3 releng/build.py frida-server --host=${HOST_PLATFORM}
          
          # 情況 2：使用 releng/deps.py + meson
          elif [ -f "releng/deps.py" ]; then
            python3 releng/deps.py get --host=${HOST_PLATFORM}
            python3 releng/meson/meson.py setup build --cross-file build/frida-${HOST_PLATFORM}.txt -Dserver=enabled
            python3 releng/meson/meson.py compile -C build frida-server
          
          # 情況 3：舊版 Frida 15/16 傳統 Makefile
          else
            make FRIDA_HOST=${HOST_PLATFORM} server-${HOST_PLATFORM} || \
            make FRIDA_HOST=${HOST_PLATFORM}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-${{ github.event.inputs.frida_version }}-android-${{ github.event.inputs.target_arch }}
          path: |
            build/frida-android-*/bin/frida-server*
            build/frida-android-*/subprojects/frida-core/server/frida-server*
            build/submodules/frida-core/server/frida-server*
            build/server/frida-server*
            **/frida-server
