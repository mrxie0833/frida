name: Build Frida Server

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida Version/Tag (例如: 16.1.4 或 16.5.1)'
        required: true
        default: '16.1.4'
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm
          - x86
          - x86_64

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.frida_version }}
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git flex bison libglib2.0-dev ninja-build pkg-config

      # 使用 Runner 預裝的 Android NDK 設定環境變數
      - name: Setup NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Build Frida Server
        run: |
          TARGET="android-${{ github.event.inputs.target_arch }}"
          
          # 優先使用 16.x / 17.x 官方標準構建入口
          if [ -f "releng/build.py" ]; then
            python3 releng/build.py frida-server --host=${TARGET}
          else
            # 舊版 fallback 邏輯
            make FRIDA_HOST=${TARGET} server-${TARGET} || make FRIDA_HOST=${TARGET}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-${{ github.event.inputs.frida_version }}-android-${{ github.event.inputs.target_arch }}
          path: |
            build/frida-android-*/bin/frida-server*
            build/frida-android-*/subprojects/frida-core/server/frida-server*
            build/subprojects/frida-core/server/frida-server*
            **/frida-server
