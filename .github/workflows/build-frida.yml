name: Build Frida Server

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida Version/Tag (例如: 16.1.4 或 16.5.1)'
        required: true
        default: '16.1.4'
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm
          - x86
          - x86_64

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.frida_version }}
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git flex bison libglib2.0-dev ninja-build pkg-config

      # 使用 Runner 預裝的 Android NDK 設定環境變數
      - name: Setup NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        
      - name: Build Frida Server
        run: |
          TARGET="android-${{ github.event.inputs.target_arch }}"
          
          # 優先使用 16.x / 17.x 官方標準構建入口
          if [ -f "releng/build.py" ]; then
            python3 releng/build.py frida-server --host=${TARGET}
          else
            # 舊版 fallback 邏輯
            make FRIDA_HOST=${TARGET} server-${TARGET} || make FRIDA_HOST=${TARGET}
          fi

      - name: Debug Find Files (排查檔案位置)
        if: always()
        run: |
          echo "=== 搜尋 build 目錄下的 frida 相關檔案 ==="
          find build -type f -name "*frida-server*" 2>/dev/null || true

      - name: Prepare Artifact Directory
        run: |
          # 建立乾淨的收集目錄
          mkdir -p output_dist
          
          # 搜尋 build 目錄下 >100KB 且可執行的 frida-server 實體檔案，複製到 output_dist
          find build/ -type f -name "frida-server*" -size +100k -exec cp {} output_dist/ \;
          
          echo "=== 準備上傳的打包檔案清單 ==="
          ls -lh output_dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-${{ github.event.inputs.frida_version }}-android-${{ github.event.inputs.target_arch }}
          path: output_dist/
          if-no-files-found: error
