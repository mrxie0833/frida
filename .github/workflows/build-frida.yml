name: Build Frida Server

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida Version/Tag (例如: 15.2.2 或 16.1.4)'
        required: true
        default: '16.1.4'
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'android-arm64'
        type: choice
        options:
          - android-arm64
          - android-arm
          - android-x86
          - android-x86_64

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 抓取主倉庫（關閉預設遞迴，避免舊版子模組連結失效導致出錯）
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.frida_version }}
          fetch-depth: 0

      # 2. 手動容錯更新 Git Submodules
      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force || echo "Submodule update warning ignored"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git flex bison libglib2.0-dev

      # 3. 直接呼叫 make 進行編譯（自動處理工具鏈下載與編譯）
      - name: Build Frida Server
        run: |
          make server-${{ github.event.inputs.target_arch }}

      # 4. 上傳產出物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-${{ github.event.inputs.frida_version }}-${{ github.event.inputs.target_arch }}
          path: |
            build/frida-android-*/bin/frida-server*
            build/submodules/frida-core/server/frida-server*
