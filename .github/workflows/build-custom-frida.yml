name: Build Custom Frida

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'

jobs:
  # ------------------------------------------------------------------
  # Linux 編譯 (免憑證)
  # ------------------------------------------------------------------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libglib2.0-dev ninja-build
          pip install meson

      - name: Build
        run: |
          # 執行 Frida 預設編譯指令
          make

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frida-linux-build
          path: build/frida-*

  # ------------------------------------------------------------------
  # macOS / iOS 編譯 (改用 Ad-hoc 簽署)
  # ------------------------------------------------------------------
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ninja meson pkg-config glib

      - name: Build
        run: |
          make

      # 移除原本 Keychain 與 P12 匯入，改用 Ad-hoc 免憑證自簽
      - name: Ad-hoc Code Sign
        run: |
          find build/ -type f \( -name "*.dylib" -o -name "frida-server" \) -exec codesign -f -s - {} \;

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frida-macos-build
          path: build/frida-*

  # ------------------------------------------------------------------
  # Windows 編譯 (使用官方 Runner)
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Meson & Ninja
        run: |
          pip install meson ninja

      - name: Build
        run: |
          # 呼叫 Windows 環境下的編譯腳本
          .\releng\build.ps1

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frida-windows-build
          path: build/frida-*
