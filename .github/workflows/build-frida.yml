name: Build Frida Server

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida Version/Tag (例如: 16.1.4 或 16.5.1)'
        required: true
        default: '16.1.4'
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm
          - x86
          - x86_64

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.frida_version }}
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git flex bison libglib2.0-dev ninja-build pkg-config

      - name: Setup Android NDK
        uses: nsetup/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Frida Server
        run: |
          # 設定目標名稱
          TARGET="android-${{ github.event.inputs.target_arch }}"
          
          # 自動下載並準備 Toolchain/SDK (避免二進位傾倒)
          make -f Makefile.sdk.mk FRIDA_HOST=${TARGET} > /dev/null 2>&1 || true
          
          # 執行編譯
          if [ -f "releng/build.py" ]; then
            python3 releng/build.py frida-server --host=${TARGET}
          else
            make server-${TARGET} || make core-${TARGET}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-${{ github.event.inputs.frida_version }}-android-${{ github.event.inputs.target_arch }}
          path: |
            build/frida-android-*/bin/frida-server*
            build/frida-android-*/subprojects/frida-core/server/frida-server*
            build/subprojects/frida-core/server/frida-server*
            **/frida-server
