name: Build Frida Server

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida Version/Tag (例如: 16.1.4 或 main)'
        required: true
        default: 'main'
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm
          - x86
          - x86_64

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.frida_version }}
          fetch-depth: 0

      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force || echo "Submodule update warning ignored"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git flex bison libglib2.0-dev ninja-build

      - name: Build Frida Server
        run: |
          # 判斷專案結構：新版 (16.x+) 採用 releng/build.py
          if [ -f "releng/build.py" ]; then
            python3 releng/build.py core-android-${{ github.event.inputs.target_arch }} --enable-server
          else
            # 舊版 (15.x 及更早) 採用 Makefile 流程
            make -f Makefile.sdk.mk FRIDA_HOST=android-${{ github.event.inputs.target_arch }} || true
            make core-android-${{ github.event.inputs.target_arch }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-${{ github.event.inputs.frida_version }}-android-${{ github.event.inputs.target_arch }}
          path: |
            build/frida-android-*/bin/frida-server*
            build/tmp-android-*/frida-core/server/frida-server*
            build/tmp_thin-android-*/frida-core/server/frida-server*
            build/submodules/frida-core/server/frida-server*
